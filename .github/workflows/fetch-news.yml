name: Automated News Fetcher

on:
  # schedule:
  #   # Runs every 3 hours (at minute 0)
  #   - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Target site base URL (e.g. https://your-site.vercel.app)'
        required: false
        default: ''

jobs:
  fetch-news:
    name: Fetch and Store News
    runs-on: ubuntu-latest

    steps:
      - name: Trigger News Fetch API
        env:
          INPUT_SITE_URL: ${{ github.event.inputs.site_url }}
          ENV_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || secrets.SITE_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_API_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET_URL="${INPUT_SITE_URL:-$ENV_SITE_URL}"
          if [ -z "$TARGET_URL" ]; then
            echo "ERROR: Target site URL is not configured! Please add SITE_URL or NEXT_PUBLIC_SITE_URL secret in GitHub repository settings."
            exit 1
          fi

          # Strip trailing slash if present
          TARGET_URL="${TARGET_URL%/}"
          ENDPOINT="${TARGET_URL}/api/cron/fetch-news"

          echo "--------------------------------------------------------"
          echo "Triggering News Fetch Engine at: ${ENDPOINT}"
          echo "Timestamp: $(date -u)"
          echo "--------------------------------------------------------"

          # Perform HTTP GET request with authentication headers
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-admin-secret: ${ADMIN_SECRET}" \
            "${ENDPOINT}?adminSecret=${ADMIN_SECRET}")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "HTTP Response Status: ${HTTP_STATUS}"
          echo "--------------------------------------------------------"
          echo "Response Payload:"
          echo "$HTTP_BODY" | jq . 2>/dev/null || echo "$HTTP_BODY"
          echo "--------------------------------------------------------"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "FAILED: News fetch returned non-200 status code (${HTTP_STATUS})"
            exit 1
          fi

          echo "SUCCESS: News fetch completed successfully!"
