name: Automated Cupmat Fetcher

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Target site base URL (e.g. https://your-site.vercel.app)'
        required: false
        default: ''

jobs:
  fetch-cupmat:
    name: Fetch and Store Cupmat Matches
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Cupmat Fetch API
        env:
          INPUT_SITE_URL: ${{ github.event.inputs.site_url }}
          ENV_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET_URL="${INPUT_SITE_URL:-$ENV_SITE_URL}"
          if [ -z "$TARGET_URL" ]; then
            echo "ERROR: Target site URL is not configured!"
            exit 1
          fi
          TARGET_URL="${TARGET_URL%/}"
          ENDPOINT="${TARGET_URL}/api/cron/cupmat-fetch"
          
          echo "Triggering Cupmat Fetch Engine at: ${ENDPOINT}"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${ENDPOINT}")
            
          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          
          echo "HTTP Response Status: ${HTTP_STATUS}"
          echo "$HTTP_BODY" | jq . 2>/dev/null || echo "$HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "FAILED: Cupmat fetch returned non-200 status code (${HTTP_STATUS})"
            exit 1
          fi
          echo "SUCCESS: Cupmat fetch completed successfully!"
