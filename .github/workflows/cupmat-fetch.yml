name: Automated CupMat Fetch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Target site base URL (e.g. https://your-site.vercel.app)'
        required: false
        default: ''

jobs:
  cupmat-fetch:
    name: CupMat Fetch Matches
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CupMat API
        env:
          INPUT_SITE_URL: ${{ github.event.inputs.site_url }}
          ENV_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET_URL="${INPUT_SITE_URL:-$ENV_SITE_URL}"
          if [ -z "$TARGET_URL" ]; then exit 1; fi
          TARGET_URL="${TARGET_URL%/}"
          ENDPOINT="${TARGET_URL}/api/cron/cupmat-fetch"
          echo "Triggering: ${ENDPOINT}"
          curl -s -w "\nHTTP_STATUS:%{http_code}" -H "Authorization: Bearer ${CRON_SECRET}" "${ENDPOINT}"
